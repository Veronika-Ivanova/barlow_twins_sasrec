cuda_visible_devices: 0

data_path: data/beauty.csv # path to csv with structure as in after get_movielens_data(include_time=True)
splitting: 'temporal'
project_name: 'BTSasRec'
task_name: 'Beauty. Dross'

dataloader:
  batch_size: 64 #1024
  n_neg_samples: 1024
  augmentations:

model: 'SASRec' # not used
model_params:
  fwd_type: 'dross' # DO NOT CHANGE
  sampling: 'dross' # DO NOT USE FOR CE AND RCE
  
  maxlen: 200
  hidden_units: 64
  num_blocks: 2
  num_heads: 1
  dropout_rate: 0.6

trainer_params:
  num_epochs: 300
  patience: 10 #50    # nmb of epoches to wait for improvement in validation metrics
  skip_epochs: 1  # how often to check if validation metrics are improved
  learning_rate: 0.001
  seed: 1235