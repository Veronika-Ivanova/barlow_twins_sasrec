cuda_visible_devices: 0

data_path: 'None' # path to csv with structure as in after get_movielens_data(include_time=True)
splitting: 'temporal'
project_name: 'BTSasRec'
task_name: 'ML1M. BCE'

dataloader:
  batch_size: 64
  n_neg_samples: 256 # DO NOT USE FOR CE AND RCE
  augmentations:

model: 'SASRec' # not used
model_params:
  fwd_type: 'bce' # DO NOT CHANGE
  sampling: 'without_rep' # DO NOT USE FOR CE AND RCE
  #gbce_t: 0.75

  maxlen: 200
  hidden_units: 64
  num_blocks: 2
  num_heads: 1
  dropout_rate: 0.1

trainer_params:
  num_epochs: 1000
  patience: 10    # nmb of epoches to wait for improvement in validation metrics
  skip_epochs: 1  # how often to check if validation metrics are improved
  learning_rate: 0.001
  seed: 37
