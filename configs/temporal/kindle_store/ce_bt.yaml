cuda_visible_devices: 0

data_path: data/kindle.csv # path to csv with structure as in after get_movielens_data(include_time=True)
splitting: 'temporal'
project_name: 'BTSasRec'
task_name: 'Kindle Store. Full CE Barlow Twins'

dataloader:
  batch_size: 64
  n_neg_samples: 0
  augmentations:
    target_semantic:
        enable: True

model: 'SASRec' # not used
model_params:
  fwd_type: 'ce' # DO NOT CHANGE
  sampling: 'no_sampling' # DO NOT USE FOR CE AND RCE
  
  maxlen: 200
  hidden_units: 64
  num_blocks: 2
  num_heads: 1
  dropout_rate: 0.3

  ssl:
    lmd: 1.0 #1.0
    barlow_twins:
      proj_layers: NULL #NULL
      proj_dim: 64 #1024 #2048
      lmd_sem: 0.05
  
  n_buckets: 658
  bucket_size_x: 658
  bucket_size_y: 256
  mix_x: True # mix states embs with random matrix

trainer_params:
  num_epochs: 300
  patience: 10    # nmb of epoches to wait for improvement in validation metrics
  skip_epochs: 1  # how often to check if validation metrics are improved
  learning_rate: 0.001
  seed: 42
