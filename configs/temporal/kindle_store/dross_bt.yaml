cuda_visible_devices: 0

data_path: data/kindle.csv # path to csv with structure as in after get_movielens_data(include_time=True)
splitting: 'temporal'
project_name: 'BTSasRec'
task_name: 'Kindle Store. Dross Barlow Twins'

dataloader:
  batch_size: 64
  n_neg_samples: 1024
  augmentations:
    target_semantic:
        enable: True

model: 'SASRec' # not used
model_params:
  fwd_type: 'dross' # DO NOT CHANGE
  sampling: 'dross'
  
  maxlen: 200
  hidden_units: 64
  num_blocks: 2
  num_heads: 1
  dropout_rate: 0.3

  ssl:
    lmd: 0.05 #1.0
    barlow_twins:
      proj_layers: NULL #NULL
      proj_dim: 64 #1024 #2048
      lmd_sem: 0.2
      supervised_aug: True

trainer_params:
  num_epochs: 300
  patience: 10    # nmb of epoches to wait for improvement in validation metrics
  skip_epochs: 1  # how often to check if validation metrics are improved
  learning_rate: 0.001
  seed: 42
